<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JapanLearn 🇯🇵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .score-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .score-item {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 10px 20px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }

        .score-item .num {
            font-size: 24px;
            font-weight: 700;
        }

        .score-item .label {
            font-size: 11px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .tag {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .japanese {
            font-size: 56px;
            color: #1a1a2e;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .reading {
            font-size: 18px;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 16px auto;
            border-radius: 2px;
        }

        .meaning {
            font-size: 28px;
            font-weight: 700;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .example {
            font-size: 15px;
            color: #999;
            font-style: italic;
            margin-bottom: 8px;
        }

        .hidden { display: none; }

        .buttons {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        #revealBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 100%;
        }

        #correctBtn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            flex: 1;
        }

        #wrongBtn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #333;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇯🇵 JapanLearn</h1>
            <p>N5 Vocabulary Quiz</p>
        </div>

        <div class="score-bar">
            <div class="score-item">
                <div class="num" id="score">0</div>
                <div class="label">✅ Correct</div>
            </div>
            <div class="score-item">
                <div class="num" id="wrong">0</div>
                <div class="label">❌ Wrong</div>
            </div>
            <div class="score-item">
                <div class="num" id="total">0</div>
                <div class="label">📚 Total</div>
            </div>
        </div>

        <div class="card">
            <div class="tag">N5 Vocabulary</div>
            <div class="japanese" id="word">...</div>
            <div class="reading" id="reading">...</div>
            <div class="divider"></div>
            <div class="meaning hidden" id="meaning">...</div>
            <div class="example hidden" id="example">...</div>

            <div class="buttons">
                <button id="revealBtn" onclick="reveal()">
                    Reveal Answer 👁️
                </button>
                <button id="correctBtn" class="hidden" onclick="markCorrect()">
                    ✅ Got it!
                </button>
                <button id="wrongBtn" class="hidden" onclick="markWrong()">
                    ❌ Missed it
                </button>
            </div>
        </div>
    </div>

    <script>
        let score = 0, wrong = 0, total = 0;

        async function loadWord() {
            const res  = await fetch('/api/vocabulary/random');
            const data = await res.json();

            document.getElementById('word').textContent    = data.word;
            document.getElementById('reading').textContent = data.reading;
            document.getElementById('meaning').textContent = data.meaning;
            document.getElementById('example').textContent = data.example;

            document.getElementById('meaning').classList.add('hidden');
            document.getElementById('example').classList.add('hidden');
            document.getElementById('revealBtn').classList.remove('hidden');
            document.getElementById('correctBtn').classList.add('hidden');
            document.getElementById('wrongBtn').classList.add('hidden');

            total++;
            updateScore();
        }

        function reveal() {
            document.getElementById('meaning').classList.remove('hidden');
            document.getElementById('example').classList.remove('hidden');
            document.getElementById('revealBtn').classList.add('hidden');
            document.getElementById('correctBtn').classList.remove('hidden');
            document.getElementById('wrongBtn').classList.remove('hidden');
        }

        function markCorrect() { score++; updateScore(); loadWord(); }
        function markWrong()   { wrong++; updateScore(); loadWord(); }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('wrong').textContent = wrong;
            document.getElementById('total').textContent = total;
        }

        loadWord();
    </script>
</body>
</html>
