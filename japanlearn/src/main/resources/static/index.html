<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JapanLearn 🇯🇵</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 380px;
        }
        .japanese { font-size: 52px; margin-bottom: 10px; }
        .reading  { font-size: 20px; color: #666; margin-bottom: 10px; }
        .meaning  { font-size: 24px; font-weight: bold; color: #e63946; margin-bottom: 10px; }
        .example  { font-size: 16px; color: #888; margin-bottom: 20px; }
        .score    { font-size: 16px; color: #444; margin-bottom: 20px; }
        .hidden   { visibility: hidden; }
        button {
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            color: white;
        }
        #revealBtn   { background: #457b9d; }
        #correctBtn  { background: #2a9d8f; display: none; }
        #wrongBtn    { background: #e76f51; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🇯🇵 JapanLearn</h2>
        <div class="score">
            ✅ <span id="score">0</span> &nbsp;
            ❌ <span id="wrong">0</span> &nbsp;
            Total: <span id="total">0</span>
        </div>
        <div class="japanese" id="word">...</div>
        <div class="reading"  id="reading">...</div>
        <div class="meaning hidden" id="meaning">...</div>
        <div class="example hidden" id="example">...</div>
        <br>
        <button id="revealBtn"  onclick="reveal()">Reveal Answer 👁️</button>
        <button id="correctBtn" onclick="markCorrect()">✅ Got it!</button>
        <button id="wrongBtn"   onclick="markWrong()">❌ Missed it</button>
    </div>

    <script>
        let score = 0;
        let wrong = 0;
        let total = 0;

        async function loadWord() {
            const res  = await fetch('/api/vocabulary/random');
            const data = await res.json();

            document.getElementById('word').textContent    = data.word;
            document.getElementById('reading').textContent = data.reading;
            document.getElementById('meaning').textContent = data.meaning;
            document.getElementById('example').textContent = data.example;

            document.getElementById('meaning').classList.add('hidden');
            document.getElementById('example').classList.add('hidden');
            document.getElementById('revealBtn').style.display  = 'inline-block';
            document.getElementById('correctBtn').style.display = 'none';
            document.getElementById('wrongBtn').style.display   = 'none';

            total++;
            updateScore();
        }

        function reveal() {
            document.getElementById('meaning').classList.remove('hidden');
            document.getElementById('example').classList.remove('hidden');
            document.getElementById('revealBtn').style.display  = 'none';
            document.getElementById('correctBtn').style.display = 'inline-block';
            document.getElementById('wrongBtn').style.display   = 'inline-block';
        }

        function markCorrect() {
            score++;
            updateScore();
            loadWord();
        }

        function markWrong() {
            wrong++;
            updateScore();
            loadWord();
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('total').textContent = total;
            document.getElementById('wrong').textContent = wrong;
        }

        loadWord();
    </script>
</body>
</html>
